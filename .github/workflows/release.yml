name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # 集市按 package.zip 安装，版本号必须和 tag 一致，否则用户看到的版本会对不上
      - name: Verify tag matches plugin.json
        run: |
          node -e "const v=require('./plugin.json').version; const t=process.env.GITHUB_REF_NAME.replace(/^v/, ''); if (v !== t) { console.error('tag ' + t + ' != plugin.json ' + v); process.exit(1); }"

      - name: Offline tests
        run: npm run test:offline

      - name: Pack package.zip
        run: |
          cd dist
          zip -r ../package.zip .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: package.zip
          fail_on_unmatched_files: true
          # 集市详情页会展示这段：写清兼容基线，比自动生成的 commit 列表有用
          body: |
            **兼容 SiYuan 3.8.10**：3.8.10 把文档树换成了虚拟列表，本版已适配 ——
            拖到笔记本、文档或空白处都能正确定位目标层级。同时兼容 SiYuan 3.8.0 – 3.8.9。

            **SiYuan 3.8.10 compatible.** The document tree became a virtual list in 3.8.10;
            this release handles it and still works on 3.8.0 – 3.8.9.
